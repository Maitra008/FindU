name: Backend Release Gate

on:
  push:
    branches:
      - main
      - backend-hardening-part4
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Import smoke test
        run: python -c "import src.api.app; import src.api.websocket; import src.workers.camera_worker; import src.recognition"
      - name: Run tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t findu-backend:release-gate .
